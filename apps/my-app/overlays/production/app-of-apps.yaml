apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/piyanshu-mindstix/argocd-poc
    targetRevision: HEAD
    path: apps/my-app/base
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true